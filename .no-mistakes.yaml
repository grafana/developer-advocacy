# Review guidance for the no-mistakes pipeline (https://github.com/kunchenguid/no-mistakes).
# Only the copy on the default branch is trusted, so this takes effect once merged to main.
review:
  path_instructions:
    - path: "transcripts/**"
      instructions: |
        Follow .agents/skills/review/SKILL.md in this repository. This is a public repo:
        check that no non-public video content or title can reach files, logs or PR text,
        that generated files were regenerated by script and not hand-edited, and that the
        PR description matches the diff.
    - path: ".github/workflows/**"
      instructions: |
        Follow the Workflows section of .agents/skills/review/SKILL.md.
